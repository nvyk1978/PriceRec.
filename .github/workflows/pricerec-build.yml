name: Build PriceRec APK
run-name: PriceRec build #${{ github.run_number }}

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'source.zip'
      - '.github/workflows/pricerec-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q source.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/build.gradle.kts
          test -f extracted/app/build.gradle.kts
          test -f extracted/app/pricerec-debug.jks
          test -f extracted/app/src/main/AndroidManifest.xml

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' extracted/app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' extracted/app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          SAFE_VERSION="$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "safe=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PriceRec versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build debug APK
        working-directory: extracted
        run: gradle --no-daemon --no-build-cache :app:assembleDebug --stacktrace

      - name: Verify and create versioned APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="extracted/app/build/outputs/apk/debug/app-debug.apk"
          DST="PriceRec-v${{ steps.version.outputs.safe }}.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$SRC"
          cp -f "$SRC" "$DST"
          BADGING="$($AAPT dump badging "$DST" | head -n1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "versionCode='${{ steps.version.outputs.code }}'"
          echo "$BADGING" | grep -F "versionName='${{ steps.version.outputs.name }}'"
          sha256sum "$DST" | tee SHA256SUMS.txt
          ls -lh "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceRec-v${{ steps.version.outputs.safe }}
          path: |
            PriceRec-v${{ steps.version.outputs.safe }}.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
